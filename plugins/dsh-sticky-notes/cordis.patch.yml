# dsh-sticky-notes 的 bundle patch。
#
# 这一行把本包挂进 profile 的配置树：name 解析到 package.json 的 main
# （lib/index.js，宿主半侧）；package.json 里的 dsh.client 让 Web 端
# additionally 加载 ./client（lib/client.js，浏览器半侧）。
- insert:
    - id: dsh-sticky-notes
      # name 必须等于包名（市场按 name 把 entry 挂到安装的包上）；
      # 带 scope 的名字以 @ 开头，YAML 里要加引号。
      name: "@woshiwenjunjie/dsh-sticky-notes"
